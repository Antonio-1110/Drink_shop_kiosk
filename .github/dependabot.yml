# Weekly pull requests that update dependencies, grouped so each app gets at
# most one PR for minor and patch updates. CI runs on each one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /kiosk_backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/kiosk-app
    schedule:
      interval: weekly
    groups:
      kiosk-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
    groups:
      mobile-minor:
        update-types: [minor, patch]
    # Expo SDK upgrades move many packages together and are done with
    # `npx expo install --fix`, so major versions are left to a person.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
