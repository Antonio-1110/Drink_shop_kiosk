# Weekly pull requests that update dependencies, grouped so each app gets at
# most one PR for minor and patch updates. CI runs on each one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /kiosk_backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/kiosk-app
    schedule:
      interval: weekly
    groups:
      kiosk-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
    groups:
      mobile-minor:
        update-types: [minor, patch]
    # Expo SDK upgrades move many packages together and are done with
    # `npx expo install --fix`, so major versions are left to a person.
    # Each Expo SDK pins the versions of the packages below; a minor bump
    # (React Native 0.86 -> 0.87, React 19.2 -> 19.3) needs the next SDK, so
    # only patch releases are taken until that upgrade.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
