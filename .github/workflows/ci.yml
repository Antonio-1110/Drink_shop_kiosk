# Runs on every pull request and on pushes to main. Each job checks that its folder exists
# first and passes without doing anything when it doesn't. Security audits are in
# security.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk_backend
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: |
          if [ -f kiosk_backend/manage.py ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk_backend/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kiosk_backend/requirements.txt
      - if: steps.present.outputs.yes
        run: pip install -r requirements.txt coverage
      - name: Run Django tests with coverage
        if: steps.present.outputs.yes
        run: coverage run manage.py test
      - name: Coverage report (fails below the floor in pyproject.toml)
        if: steps.present.outputs.yes
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage report
      - name: Check for missing migrations
        if: steps.present.outputs.yes
        run: python manage.py makemigrations --check --dry-run
      - name: Check production settings (manage.py check --deploy)
        if: steps.present.outputs.yes
        env:
          DJANGO_DEBUG: ""
          DJANGO_ALLOWED_HOSTS: kiosk.example.com
          DJANGO_HTTPS: "1"
          PAYNOW_PROXY_VALUE: T00LL0000A
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            python manage.py check --deploy --fail-level WARNING

  lint-python:
    name: Python and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f kiosk_backend/pyproject.toml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk_backend/pyproject.toml on this branch, skipping."; fi
      - name: Ruff (rules in kiosk_backend/pyproject.toml)
        if: steps.present.outputs.yes
        run: pipx run ruff==0.16.9 check --output-format=github kiosk_backend
      - name: ShellCheck dev.sh
        if: hashFiles('dev.sh') != ''
        run: shellcheck dev.sh

  kiosk:
    name: Kiosk UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/kiosk-app
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: |
          if [ -f frontend/kiosk-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No frontend/kiosk-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/kiosk-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Build
        if: steps.present.outputs.yes
        run: npm run build

  mobile:
    name: Mobile app lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: |
          if [ -f mobile-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No mobile-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Typecheck
        if: steps.present.outputs.yes
        run: npm run typecheck
