# Runs on every pull request and on pushes to main. Each job checks that its folder exists
# first and passes without doing anything when it doesn't. Security audits are in
# security.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk_backend
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - id: present
        working-directory: .
        run: |
          if [ -f kiosk_backend/manage.py ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk_backend/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kiosk_backend/requirements.txt
      - if: steps.present.outputs.yes
        run: pip install -r requirements.txt coverage
      - name: Run Django tests with coverage
        if: steps.present.outputs.yes
        run: coverage run manage.py test
      - name: Coverage report (fails below the floor in pyproject.toml)
        if: steps.present.outputs.yes
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage report
      - name: Check for missing migrations
        if: steps.present.outputs.yes
        run: python manage.py makemigrations --check --dry-run
      - name: Check production settings (manage.py check --deploy)
        if: steps.present.outputs.yes
        env:
          DJANGO_DEBUG: ""
          DJANGO_ALLOWED_HOSTS: kiosk.example.com
          DJANGO_HTTPS: "1"
          PAYNOW_PROXY_VALUE: T00LL0000A
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            python manage.py check --deploy --fail-level WARNING

  lint-python:
    name: Python and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: |
          if [ -f kiosk_backend/pyproject.toml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk_backend/pyproject.toml on this branch, skipping."; fi
      - name: Ruff (rules in kiosk_backend/pyproject.toml)
        if: steps.present.outputs.yes
        run: pipx run ruff==0.16.9 check --output-format=github kiosk_backend
      - name: Ruff for the edge service (rules in edge/pyproject.toml)
        if: hashFiles('edge/pyproject.toml') != ''
        working-directory: edge
        run: pipx run ruff==0.16.9 check --output-format=github .
      - name: ShellCheck dev.sh and the deploy scripts
        if: hashFiles('dev.sh') != ''
        run: shellcheck dev.sh deploy/*.sh kiosk_backend/release.sh

  docker:
    name: Docker image and PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: |
          if [ -f docker-compose.yml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No docker-compose.yml on this branch, skipping."; fi
      - name: Build and start the backend, database, worker and backups
        if: steps.present.outputs.yes
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 16)"
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "SEED_DEMO=1"
          } >> .env
          docker compose up -d --build
      - name: Wait until it answers
        if: steps.present.outputs.yes
        run: |
          for _ in $(seq 60); do
            curl -fsS http://localhost:8000/healthz/ && exit 0
            sleep 2
          done
          docker compose ps -a; docker compose logs; exit 1
      - name: Admin, static files and the API work
        if: steps.present.outputs.yes
        run: |
          curl -fsS -o /dev/null http://localhost:8000/admin/login/
          curl -fsS -o /dev/null http://localhost:8000/static/admin/css/base.css
          curl -fsS http://localhost:8000/ordering/shops/ | grep -q Demo
      - name: Run the backend tests on PostgreSQL
        if: steps.present.outputs.yes
        run: |
          # a copy of the code (the image's is read-only to its user) and a clean environment, so the
          # tests see development settings; only the database is the compose one. The edge service
          # sits next to it because one test drives it against the backend.
          docker compose cp edge web:/tmp/edge
          docker compose exec -T web sh -c \
            'cp -r /app /tmp/tests && cd /tmp/tests && env -i PATH="$PATH" HOME=/tmp DATABASE_URL="$DATABASE_URL" DJANGO_DEBUG=1 python manage.py test'
      - name: A backup can be taken
        if: steps.present.outputs.yes
        run: |
          docker compose run --rm backup --once
          ls -l backups/production/
      - if: failure() && steps.present.outputs.yes
        run: docker compose logs

  edge:
    name: Edge service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - id: present
        working-directory: .
        run: |
          if [ -d edge/tests ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No edge/ on this branch, skipping."; fi
      # the oldest Python the kiosk computer may have; the service uses the standard library only
      - if: steps.present.outputs.yes
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Unit tests (simulator, fake backend)
        if: steps.present.outputs.yes
        run: python -m unittest discover -s tests -t tests -v

  kiosk:
    name: Kiosk UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-app
    steps:
      - uses: actions/checkout@v7
      - id: present
        working-directory: .
        run: |
          if [ -f kiosk-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiosk-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Test
        if: steps.present.outputs.yes
        run: npm test
      - name: Build
        if: steps.present.outputs.yes
        run: npm run build

  mobile:
    name: Mobile app lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v7
      - id: present
        working-directory: .
        run: |
          if [ -f mobile-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No mobile-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Typecheck
        if: steps.present.outputs.yes
        run: npm run typecheck
