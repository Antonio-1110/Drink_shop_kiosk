# Runs on every pull request and on pushes to main. Each job checks that its folder exists
# first and passes without doing anything when it doesn't, so branches that
# don't have the mobile app (or anything else) yet still go green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f kiosk_backend/manage.py ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No kiosk_backend/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kiosk_backend/requirements.txt
      - name: Run Django tests
        if: steps.present.outputs.yes
        run: ./dev.sh --test
      - name: Check for missing migrations
        if: steps.present.outputs.yes
        working-directory: kiosk_backend
        env:
          DJANGO_DEBUG: "1"
        run: .venv/bin/python manage.py makemigrations --check --dry-run

  kiosk:
    name: Kiosk UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/kiosk-app
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: |
          if [ -f frontend/kiosk-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No frontend/kiosk-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/kiosk-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Build
        if: steps.present.outputs.yes
        run: npm run build

  mobile:
    name: Mobile app lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: |
          if [ -f mobile-app/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No mobile-app/ on this branch, skipping."; fi
      - if: steps.present.outputs.yes
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - if: steps.present.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: steps.present.outputs.yes
        run: npm run lint
      - name: Typecheck
        if: steps.present.outputs.yes
        run: npm run typecheck
