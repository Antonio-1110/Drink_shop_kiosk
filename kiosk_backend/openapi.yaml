openapi: 3.0.3
info:
  title: Drink Shop Kiosk API
  version: 0.1.0
  description: |-
    Backend for the self-order kiosk and the mobile ordering app: menu, stock, orders and PayNow payment.

    Base URL: `http://localhost:8000` in development. The kiosk UI and the mobile app in a browser reach it through their dev-server proxy at `/api`. A phone on the same Wi-Fi uses `http://<computer IP>:8000`: start the backend with `./dev.sh --lan`, which listens on the network and adds that address to `DJANGO_ALLOWED_HOSTS`.

    Ordering endpoints are public. Everything else needs a staff login (session or HTTP Basic).
paths:
  /checkout/webhooks/{method}/:
    post:
      operationId: checkout_webhooks_create
      description: Each provider posts here with its own format and signature, checked
        by that provider's code.
      summary: Payment notification from a payment provider
      parameters:
      - in: path
        name: method
        schema:
          type: string
        required: true
      tags:
      - checkout
      security:
      - {}
      responses:
        '200':
          description: Processed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
  /operation/inventory/shop/{shop}/ingredient/{ingredient}/:
    patch:
      operationId: operation_inventory_shop_ingredient_partial_update
      summary: Set a shop's stock of an ingredient (staff only)
      parameters:
      - in: path
        name: ingredient
        schema:
          type: integer
        required: true
      - in: path
        name: shop
        schema:
          type: integer
        required: true
      tags:
      - operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInventoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInventoryRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
          description: ''
  /ordering/check-order/:
    get:
      operationId: ordering_check_order_retrieve
      summary: Check the cart can be made
      parameters:
      - in: query
        name: cart
        schema:
          type: array
          items:
            type: integer
        description: Drink IDs already in the cart, one per cup (repeat `cart` for
          each).
        explode: true
      - in: query
        name: shop_id
        schema:
          type: integer
        description: The shop (kiosk) the customer is ordering from.
        required: true
      tags:
      - ordering
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAvailable'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderUnavailable'
          description: ''
  /ordering/drinks/:
    get:
      operationId: ordering_drinks_list
      description: Drinks with enough stock for one more cup after everything already
        in the cart.
      summary: Drinks the shop can still make
      parameters:
      - in: query
        name: cart
        schema:
          type: array
          items:
            type: integer
        description: Drink IDs already in the cart, one per cup (repeat `cart` for
          each).
        explode: true
      - in: query
        name: shop_id
        schema:
          type: integer
        description: The shop (kiosk) the customer is ordering from.
        required: true
      tags:
      - ordering
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /ordering/log-order/:
    post:
      operationId: ordering_log_order_create
      description: 'Holds the ingredients and creates an unpaid order. Start paying
        with POST /ordering/orders/{id}/payments/; the hold lasts as long as that
        payment. Keep order_token: cancelling needs it.'
      summary: Place an order
      tags:
      - ordering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
          description: ''
        '400':
          description: 'Invalid order: errors keyed by field.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderUnavailable'
          description: ''
  /ordering/orders/{order_id}/cancel/:
    post:
      operationId: ordering_orders_cancel_create
      description: For the customer's Cancel button or the kiosk's idle timeout. Puts
        the ingredients back on sale straight away. Needs the order_token from placing
        the order.
      summary: Cancel an unpaid order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - ordering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancelled'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
  /ordering/orders/{order_id}/payments/:
    post:
      operationId: ordering_orders_payments_create
      description: Opens a payment with the chosen method (see PAYMENT_METHODS) and
        holds the order's ingredients until the payment expires. Calling it again
        returns the same open payment.
      summary: Start paying for an order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - ordering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStarted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
  /ordering/orders/{order_id}/paynow-qr/:
    get:
      operationId: ordering_orders_paynow_qr_retrieve
      description: Shortcut for starting a PayNow payment; same as POST .../payments/
        with method paynow.
      summary: PayNow QR code for an unpaid order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - ordering
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStarted'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
  /ordering/orders/{order_id}/status/:
    get:
      operationId: ordering_orders_status_retrieve
      summary: Payment status of an order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - ordering
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
          description: ''
  /ordering/shops/:
    get:
      operationId: ordering_shops_list
      summary: List shops
      tags:
      - ordering
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shop'
          description: ''
components:
  schemas:
    CancelOrderRequest:
      type: object
      properties:
        order_token:
          type: string
          minLength: 1
      required:
      - order_token
    CategoryEnum:
      type: string
      enum:
      - Milk Tea
      - Fruit Tea
      - Smoothie
      - Coffee
      - Others
    CheckoutError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Drink:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        name:
          type: string
          maxLength: 100
        image_url:
          type: string
          maxLength: 200
        l_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        s_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 300
      required:
      - category
      - id
      - l_price
      - name
      - s_price
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Inventory:
      type: object
      properties:
        current_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - current_stock
    LevelEnum:
      enum:
      - 4
      - 3
      - 2
      - 1
      - 0
      type: integer
      description: |-
        * `4` - 100%
        * `3` - 75%
        * `2` - 50%
        * `1` - 25%
        * `0` - 0%
    OrderAvailable:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    OrderCancelled:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    OrderCreated:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        shop:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        time:
          type: string
          format: date-time
          readOnly: true
        item_quantity:
          type: integer
          readOnly: true
        user_id:
          type: string
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        order_token:
          type: string
          readOnly: true
          description: Proof you placed this order; needed to cancel it.
      required:
      - id
      - item_quantity
      - items
      - order_token
      - revenue
      - shop
      - status
      - time
    OrderItem:
      type: object
      properties:
        drink:
          type: integer
        size:
          allOf:
          - $ref: '#/components/schemas/SizeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        sugar:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        ice:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
      required:
      - drink
    OrderItemRequest:
      type: object
      properties:
        drink:
          type: integer
        size:
          allOf:
          - $ref: '#/components/schemas/SizeEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        sugar:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        ice:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
      required:
      - drink
    OrderPaymentStatus:
      type: object
      properties:
        status:
          type: string
          description: PENDING until paid; then the paid status, or CANCELLED.
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'While PENDING: when the order is cancelled if still unpaid.'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttemptSummary'
      required:
      - hold_expires_at
      - payments
      - status
    OrderRequest:
      type: object
      properties:
        shop:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        user_id:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - items
      - shop
    OrderUnavailable:
      type: object
      properties:
        error:
          type: string
        drinks:
          type: array
          items:
            type: integer
          description: Drinks in the cart that can't be made.
        ingredients:
          type: array
          items:
            type: integer
          description: Ingredients that ran short.
      required:
      - drinks
      - error
      - ingredients
    PatchedInventoryRequest:
      type: object
      properties:
        current_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    PaymentAttemptSummary:
      type: object
      properties:
        method:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - method
      - status
    PaymentStarted:
      type: object
      properties:
        attempt:
          type: integer
        method:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        expires_at:
          type: string
          format: date-time
          description: The ingredients are held until then; after it the order is
            cancelled if unpaid.
        qr_code:
          type: string
          description: 'PayNow: PNG image as a data: URL.'
        reference:
          type: string
          description: 'PayNow: reference shown in the customer''s bank app.'
      required:
      - amount
      - attempt
      - expires_at
      - method
    Shop:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        shop_type:
          allOf:
          - $ref: '#/components/schemas/ShopTypeEnum'
          readOnly: true
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 200
      required:
      - address
      - id
      - name
      - shop_type
    ShopTypeEnum:
      type: string
      enum:
      - Flagship Store
      - Normal Store
      - Vending Machine
    SizeEnum:
      enum:
      - 1
      - 0
      type: integer
      description: |-
        * `1` - Large
        * `0` - Small
    StartPaymentRequest:
      type: object
      properties:
        method:
          type: string
          minLength: 1
      required:
      - method
    StatusEnum:
      enum:
      - PENDING
      - COMPLETED
      - CANCELLED
      - TBM
      type: string
      description: |-
        * `PENDING` - Pending
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `TBM` - To Be Made
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
